name: Verify clip pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ffmpeg and ffprobe
        run: ffmpeg -version && ffprobe -version
      - name: Compile Python
        run: python -m compileall -q clipforge tests tools
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end synthetic rendering
        run: python -m tools.smoke
