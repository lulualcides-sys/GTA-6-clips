name: Verify clip pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check ffmpeg and ffprobe
        run: ffmpeg -version && ffprobe -version
      - name: Compile Python
        run: python -m compileall -q clipforge tests tools
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check clipforge/static/app.js
          node --check clipforge/static/candidates.js
          node --check clipforge/static/agents.js
          node --check clipforge/static/editor.js
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end synthetic rendering
        run: python -m tools.smoke
      - name: Integrated Astra acceptance with owned synthetic media
        run: python -m tools.astra_smoke --output data/astra-ci
      - name: Preserve reproducible synthetic demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-synthetic-demo
          path: |
            data/astra-ci/report.json
            data/astra-ci/rendered/*.mp4
            data/astra-ci/hyperframes/*/hyperframes-project.zip
          retention-days: 7
