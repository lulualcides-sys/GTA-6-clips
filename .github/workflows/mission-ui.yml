name: Mission Control browser smoke
on:
  pull_request:
    paths:
      - "clipforge/static/**"
      - "clipforge/telemetry.py"
      - "tools/browser_smoke.mjs"
      - "tools/browser_editor_smoke.mjs"
      - "tools/astra_smoke.py"
      - "clipforge/editing.py"
      - "clipforge/core.py"
      - "clipforge/web.py"
      - ".github/workflows/mission-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    # Playwright 1.56.1 não suporta Ubuntu 26.04; manter runner compatível.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DASHBOARD_TOKEN: mission-test-token-0123456789
      AUTO_SCAN: "0"
      AUTO_RENDER: "0"
      TWITCH_ENABLED: "0"
      TWITCH_CLIENT_ID: ""
      TWITCH_CLIENT_SECRET: ""
      ENABLE_SYNTHETIC_DEMO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual local server (no fake event data)
        run: |
          mkdir -p "$RUNNER_TEMP/mission-ui-data"
          export CLIPS_DATA_DIR="$RUNNER_TEMP/mission-ui-data"
          nohup python -m clipforge.web > "$RUNNER_TEMP/mission-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mission-server.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mission-server.log"
          exit 1
      - name: Verify desktop and mobile dashboard and capture screenshots
        run: node tools/browser_smoke.mjs
      - name: Install FFmpeg for actual editor acceptance
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare owned synthetic media and start isolated editor server
        run: |
          python -m tools.astra_smoke --output "$RUNNER_TEMP/astra-editor-data"
          CLIPS_DATA_DIR="$RUNNER_TEMP/astra-editor-data" PORT=8012 PUBLISHING_ENABLED=0 nohup python -m clipforge.web > "$RUNNER_TEMP/astra-editor-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8012/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/astra-editor-server.log"
          exit 1
      - name: Verify original and edited video, render and batch approval in browser
        env:
          MISSION_URL: http://127.0.0.1:8012
          # Chrome do runner inclui codecs H.264/AAC usados pelo MP4 do aplicativo.
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          /usr/bin/google-chrome --version
          node tools/browser_editor_smoke.mjs
      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-mission-control-previews
          path: ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
