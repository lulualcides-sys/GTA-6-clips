name: Windows app - build and verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop_launcher.py
      - clipforge/**
      - tools/build_windows.py
      - tools/build_autoclip_runtime.py
      - desktop_update_helper.py
      - tests/test_desktop.py
      - tests/test_updater.py
      - .github/workflows/windows-app.yml
  pull_request:
    paths:
      - desktop_launcher.py
      - clipforge/**
      - tools/build_windows.py
      - tools/build_autoclip_runtime.py
      - desktop_update_helper.py
      - tests/test_desktop.py
      - tests/test_updater.py
      - .github/workflows/windows-app.yml

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AUTO_SCAN: "0"
      AUTO_RENDER: "0"
      TWITCH_ENABLED: "0"
      AUTO_TRANSCRIBE: "0"
      ENABLE_SYNTHETIC_DEMO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Ensure FFmpeg and ffprobe exist
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
            refreshenv
          }
          $ffmpegCmd = Get-Command ffmpeg -ErrorAction Stop
          $ffprobeCmd = Get-Command ffprobe -ErrorAction Stop
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $ffmpegCmd.Source)
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $ffprobeCmd.Source)
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Install GUI packager
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.12,<7" "pywebview>=5.4,<7"
      - name: Python and API regression tests
        run: python -m unittest discover -s tests -v
      - name: Real FFmpeg synthetic render smoke
        run: python -m tools.smoke
      - name: Build portable native .exe with local FFmpeg
        run: python -m tools.build_windows
      - name: Bundle real AutoClip Python 3.12 + Whisper + MediaPipe
        run: python -m tools.build_autoclip_runtime
      - name: Test the FROZEN executable and loopback API
        shell: pwsh
        run: |
          $json = Join-Path $env:RUNNER_TEMP "gta6-desktop-selftest.json"
          $env:GTA6_SELFTEST_PATH = $json
          $exe = (Resolve-Path "./dist/GTA6Clips/GTA6Clips.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test") -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          $result = $null
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $json) {
              try { $result = Get-Content $json -Raw | ConvertFrom-Json } catch {}
              if ($result -and $result.phase -in @("complete","exception")) { break }
            }
            if ($process.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $result) { $result = [pscustomobject]@{ phase="no_report"; status="fail" } }
          $result | ConvertTo-Json
          if ($result.phase -ne "complete") {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Frozen executable did not complete. Last phase: $($result.phase)"
          }
          if (-not $process.WaitForExit(5000)) {
            Stop-Process -Id $process.Id -Force
            throw "Frozen executable did not exit cleanly after self-test"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged EXE returned $($process.ExitCode)" }
          if ($result.status -ne "pass") { throw "Packaged EXE self-test failed" }
          if (-not $result.ffmpeg -or -not $result.ffprobe -or -not $result.protected_api -or -not $result.pythonnet -or -not $result.webview2_core -or -not $result.autoclip_cli) {
            throw "Missing native tools, managed WebView2.Core/pythonnet loader or protected API"
          }
      - name: Preserve frozen validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-selftest-report
          path: ${{ runner.temp }}/gta6-desktop-selftest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify standalone update helper
        shell: pwsh
        run: |
          & "./dist/GTA6Clips/GTA6ClipsUpdater.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows update helper failed its own self-test" }
          if (-not (Test-Path "./dist/GTA6Clips/GTA6ClipsUpdater.exe")) {
            throw "Windows update helper missing"
          }
      - name: Verify repair of Python.NET and WebView2 downloaded DLL blocks
        shell: pwsh
        run: |
          $root = "./dist/GTA6Clips"
          $pythonDll = (Resolve-Path "$root/_internal/pythonnet/runtime/Python.Runtime.dll" -ErrorAction Stop).Path
          $webviewDll = (Resolve-Path "$root/_internal/webview/lib/Microsoft.Web.WebView2.Core.dll" -ErrorAction Stop).Path
          $repair = (Resolve-Path "./Corrigir-e-Abrir-GTA6Clips.cmd" -ErrorAction Stop).Path
          $marked = @($pythonDll, $webviewDll)
          $hashes = @{}
          foreach ($dll in $marked) {
            $hashes[$dll] = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
            Set-Content -LiteralPath $dll -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3" -ErrorAction Stop
            if (-not (Get-Item -LiteralPath $dll -Stream Zone.Identifier -ErrorAction SilentlyContinue)) {
              throw "Unable to simulate Mark-of-the-Web for $dll"
            }
          }
          $unrelated = Join-Path $env:RUNNER_TEMP "gta6-do-not-touch.txt"
          Set-Content -LiteralPath $unrelated -Value "sentinel"
          Set-Content -LiteralPath $unrelated -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3"
          $env:GTA6CLIPS_REPAIR_ONLY = "1"
          try {
            Copy-Item -LiteralPath $repair -Destination "$root/Corrigir-e-Abrir-GTA6Clips.cmd"
            & "$root/Corrigir-e-Abrir-GTA6Clips.cmd"
            if ($LASTEXITCODE -ne 0) { throw "Repair failed: exit $LASTEXITCODE" }
            foreach ($dll in $marked) {
              if (Get-Item -LiteralPath $dll -Stream Zone.Identifier -ErrorAction SilentlyContinue) {
                throw "Mark-of-the-Web remains on $dll"
              }
              if ((Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash -ne $hashes[$dll]) {
                throw "DLL content unexpectedly changed: $dll"
              }
            }
            if (-not (Get-Item -LiteralPath $unrelated -Stream Zone.Identifier -ErrorAction SilentlyContinue)) {
              throw "Reparador alterou arquivo externo ao pacote"
            }
          } finally {
            Remove-Item Env:GTA6CLIPS_REPAIR_ONLY -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $unrelated -Force -ErrorAction SilentlyContinue
          }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Copy-Item docs/DESKTOP_WINDOWS.md dist/GTA6Clips/LEIA-ME-PRIMEIRO.md
          Copy-Item LICENSES.md dist/GTA6Clips/LICENSES.md
          $forbidden = Get-ChildItem dist/GTA6Clips -Recurse -File | Where-Object {
            $_.Name -match '^(config\.env|\.env|.*\.rights\.json|.*\.sqlite3?)$'
          }
          if ($forbidden) { throw "Private runtime data found in distribution" }
          Compress-Archive -Path "dist/GTA6Clips/*" -DestinationPath "dist/GTA6Clips-Windows-portable.zip" -Force
          if ((Get-Item "dist/GTA6Clips-Windows-portable.zip").Length -lt 1000000) { throw "Suspiciously small ZIP" }
          $digest = (Get-FileHash dist/GTA6Clips-Windows-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  GTA6Clips-Windows-portable.zip" | Set-Content dist/GTA6Clips-Windows-portable.zip.sha256
      - name: Upload Windows app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Clips-Windows-Portable
          path: |
            dist/GTA6Clips-Windows-portable.zip
            dist/GTA6Clips-Windows-portable.zip.sha256
          compression-level: 0
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GTA6Clips-Windows-Portable
          path: release
      - name: Publish stable GitHub Release only for new app version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'from clipforge.version import VERSION; print(VERSION)')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; not replacing signed release assets"
            exit 0
          fi
          test -s release/GTA6Clips-Windows-portable.zip
          cd release
          sha256sum GTA6Clips-Windows-portable.zip > GTA6Clips-Windows-portable.zip.sha256
          gh release create "$TAG" \
            GTA6Clips-Windows-portable.zip \
            GTA6Clips-Windows-portable.zip.sha256 \
            --repo "$REPOSITORY" --target "${GITHUB_SHA}" \
            --title "GTA VI Clips $TAG" --generate-notes --latest
          echo "Permanent release published: $TAG"

